<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="The Pilgrim's Progress (The Unburdened Road): a 3D adventure from John Bunyan's dream. Leave the City of Destruction, cross the Slough of Despond, and climb to the Cross." />
    <title>The Pilgrim's Progress (The Unburdened Road)</title>
    <!-- Anonymous visit counting (Umami): no cookies, no names. Only counts on the live site. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="4bedbe1a-0561-4c58-9766-b02b2c00c4c4" data-domains="games.thecuriousseekers.com"></script>

  <body>
    <canvas id="c" tabindex="0" aria-label="Game view"></canvas>
    <div id="ui">
      <div id="vignette"></div>
      <div id="mud"></div>
      <div id="objective" role="status"></div>
      <div id="hint"></div>
      <div id="toast" role="status"></div>
      <div id="prompt"></div>
      <div id="subs" aria-live="polite"></div>
      <div id="dlg">
        <div id="dlg-name"></div>
        <div id="dlg-text"></div>
        <div id="dlg-choices"></div>
        <div id="dlg-next">E / Enter ▸</div>
      </div>
      <div id="card"><div id="card-title"></div><div id="card-sub"></div></div>
      <div id="paper"><div id="paper-inner"><h2 id="paper-title"></h2><div id="paper-body"></div><div id="paper-close">E / Enter — put it away</div></div></div>
      <div id="fade"></div>
      <div id="menu"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
