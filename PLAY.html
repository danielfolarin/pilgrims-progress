at's more than Vane ever said. It doesn't light the oven."]]},{t:"(Say nothing.)",then:[["hester","No. I thought not."]]}]}],else:[["hester","You said it to my face. I'll give you that. I've nothing else to give you today."]]}],else:[["hester","If you see Joss on that road — the oven's still lit. That's all."]]}]}]}]},pg={start:[{when:i=>!!i.slip,then:[{go:"done"}],else:[{when:i=>i.slipFound,then:[{go:"give"}],else:[{when:i=>i.pipAsked,then:[["pip","Did you find it? By the cart behind Hester's. I looked twice."]],else:[{go:"first"}]}]}]}],first:[["pip","Don't. I'm not crying. It's the ash."],{choice:[{t:"What's happened?"},{t:"All right. It's the ash.",then:[["pip","…It's not the ash."]]}]},["pip","I had a slip to run to the Tally-House. Master Vane's own seal. I had it in my hand at the bakery corner, and then the ground did its shake, and I ran, and now I haven't got it."],["pip","A runner who loses a slip gets chalked a liar. Liars don't get run-work. My mam needs the run-work."],{choice:[{t:"Where did you last have it?",then:[["pip","By the cart behind Hester's. I looked. I looked twice."]]},{t:"I'll keep an eye out.",then:[["pip","Everyone says that. (He sniffs.) By the cart behind Hester's, if you mean it."]]}]},{set:{pipAsked:!0}}],give:[["you","Pip. Is this it?"],["pip","That's it! That's the seal! Oh — give it here, I can still make the bell —"],["you","It's Hester's. He's calling in the whole debt on her oven."],["pip","I don't read them. I just run them. …Is it bad?"],{choice:[{t:"It's bad. But it isn't yours to carry. Here.",set:{slip:"pip"},then:[["pip","(He takes it in both hands.) I'll run it slow. That's all I can do. I'll run it slow."],["thought","He goes. The slip will arrive. The city will do what it does."],{run:i=>i.story.sync()}]},{t:"Come with me. Hester should see this before Vane does.",then:[["pip","I'll get chalked."],["you","Not if she walks in with you."],["thought","He weighs it. Then he gets up and wipes his face on his sleeve. (Take ip,then:[{choice:[{t:"I found this. It carries your seal.",set:{slip:"vane"},then:[["vane","Ah. The boy lost it. (He reads it as if he had not written it.) Honest of you. Honesty is rare, and I mark it."],["dream","And he took the chalk, and set a stroke beside the pilgrim's name."],["vane","There. You will feel that."],["thought","You do feel it. For about a breath. Then the weight settles back exactly where it was — and behind you, by the well, a small boy has stopped crying to watch."],{run:i=>i.story.sync()}]},{t:"(Keep the slip in your coat.)"}]}]}]},Yh={start:[{when:i=>!i.wellTalked,then:[{go:"first"}],else:[["obstinate","Still here? Good. Stay here. There's a wall wants holding up."],["pliable","(Behind his back, Pliable mouths: tell me if you go.)"]]}],first:[["obstinate","Look at the state of you. Bent like a hod-carrier with nothing in the hod."],["pliable","Leave off, Ob. — Is it true you've been reading that book? The one that says there's somewhere else?"],{choice:[{t:"It says the city won't stand.",then:[["obstinate","I built the north wall. My father's mortared into the footings; he fell off it. It stands because people like me get up and make it stand. Not because people like you read."]]},{t:"It says there is a country where none of this is owed.",then:[["pliable","None of it? No tally?"],["obstinate","Somebody's always keeping a tally, lad. At least ours is up where you can see it."]]}]},["pliable","If you ever do go… would you say? Before?"],["obstinate","Nobody's going anywhere. They get as far as the Slough and come home green to the knees."],{set:{wellTalked:!0}}]},gg={porter:["Mind your back — ha. Sorry. Didn't mean yours.","Third load before noon. Third mark. Doesn't feel like three.","My knees say stop. The board says don't. The board's louder."],chalker:["You have to chalk your own step fresh each morning, or they say you've let yourself go.","My neighbour chalks hers twice. Twice! Showing off.","If it rains, we all start again. I used to like rain."],oldman:["I watched that wall go up when I was a boy. They said it'd be finished in my lifetime. (He laughs.) It's been finished four times.","The stranger in the stubble? I listened. I said I'm too old to carry anything to a gate. He said that wasn't how it worked. I didn't follow him.","Go on, if you're going. Somebody ought to find out."]},_g={start:[{when:i=>i.metEvangelist,then:[["evangelist","Keep the light in your eye. And shout if you sink — you won't be the first, whatever the marsh tells you."]],else:[{go:"first"}]}],first:[["evangelist","You're the one who reads on the doorstep before light. I've passed your lane three mornings. What is in that book, that it bends you so?"],{choice:[{t:"That the city is coming down. And that I helped build what's wrong with it.",then:[["evangelist","Both true. It will not be mended by another course of stone — though the one who made this place has not given it up. Mind that."]]},{t:"That I owe more than the board has room for.",then:[["evangelist","The board is a small liar. But yes: there is a debt, and it isn't in marks."]]},{t:"I don't know that it's the book. I've carried this as long as I can remember.",then:[["evangelist","Most have. The book only turns the lamp up on it."]]}]},["you","Then what do I do? I've tried working it off. I've tried not looking at it."],["evangelist","If that is your condition, why are you standing still?"],["you","Because I don't know where to go."],["evangelist","(He points with his staff, out over the plain.) Past the marsh. Do you see a little gate?"],["you","…No."],["evangelist","Do you see a light?"],["you","I think I do."],["evangelist","Keep that light in your eye, and go straight up to it, and knock. You'll be told what to — no. You'll be let in. That's the truer way to say it."],{run:i=>i.story.showLight()},{go:"ask"}],ask:[{choice:[{t:"What does it cost?",once:!0,then:[["evangelist","Everything it cost has been paid by someone else. You'll see where."]],go:"ask"},{t:"My family —",once:!0,then:[["evangelist","Tell them. Ask them. Some come at once; some come after; the gate is kept for both. Don't make your going a verdict on their staying."]],go:"ask"},{t:"And if the gate is shut to someone like me?",once:!0,then:[["evangelist","It isn't that kind of gate."]],go:"ask"},{t:"I'll go.",go:"send"}]}],send:[["evangelist","Take this. Read it when your back says you were a fool to start."],{run:i=>i.ui.read("A parchment roll","<p><i>Come unto me, all ye that labour and are heavy laden, and I will give you rest.</i></p>")},["evangelist","One thing more. Between here and the light there is bad ground — the Slough. People go into it believing they're the only one who ever has. They are not. Shout, if you sink."],{set:{metEvangelist:!0}}]};function vg(i){return`<div class="tally">${[["Vane, Reckoner","||||| ||||| ||||| |||"],["Crook, tanner","||||| ||||| ||||"],["Obstinate, mason","||||| ||||| |"],["Ledger, widow","||||| ||||"],["Hester, baker",i.slip==="vane"?"— oven called in —":"||||| |"],["Joss, baker's man","— struck off: absent —"],["Pliable","|||"],["(your name)",i.slip==="vane"?"|||":"||",!0],["Pip, runner","|"]].map(([n,s,r])=>`<span class="${r?"mine":""}">${n.padEnd(22," ")}${s}</span>`).join(`
`)}</div><p><i>Everyone you know, in a column. Your own name is near the bottom, where it has always been.${i.slip==="vane"?" The newest stroke beside it is still white.":""}</i></p>`}const yg="<p><b>BY ORDER OF THE RECKONER</b></p><p>HESTER, baker, of Baker's Lane — oven and premises —<br/>FORTY MARKS, <u>called in full</u>, payable Friday.</p><p>— Vane (his seal)</p><p><i>Called in. She does not know yet.</i></p>",xg={start:[["obstinate","Oi! Stop there!"],["you","Obstinate. Pliable."],["obstinate","Your wife's standing in the lane looking at the gate. Come back. Whatever the old man sold you, come back, and I'll say nothing, and nobody'll chalk it."],{choice:[{t:"Come with me instead. Both of you.",then:[["obstinate","And leave the wall? Leave everyone under it? You call that conscience. I call it running."]]},{t:"I can't, Ob. I can't carry this another year.",then:[["obstinate","Everyone carries something! You think you're special because yours shows?"]]}]},["you","I think there's someone who takes it. That's all I've got."],["pliable","Ob… what if there is?"],["obstinate","Oh, not you too."],["pliable","I'm only going to look. I'll walk as far as the marsh. If it's nothing, I'll be home for supper."],["obstinate","You'll be home for supper smelling of bog. The pair of you."],["obstinate","(Lower, to you.) When it goes wrong — the Field Gate doesn't lock. I'll see to that."]]},Ao=["So what's there, exactly? At the end? Go on.","Crowns, I heard. Somebody said crowns.","You're slow with that thing on. No offence.","Do you think they'd let Ob in? He'd argue with the gatepost.","It's quiet out here. I've never been where you couldn't hear the Tally bell."],wg={start:[["pliable","Urgh — it's — I can't feel the bottom —"],["pliable","Is THIS it? Is this the road to your shining country? You said —"],{choice:[{t:"I didn't know it was here. I'm sorry — I didn't know.",then:[["pliable","If this is how it starts, you can keep the end of it!"]]},{t:"Keep going! It can't be far across!",then:[["pliable","You don't know that! You don't know anything, you've just got a book!"]]},{t:"Nobody made you come, Pliable.",then:[["pliable","No. Nobody did. And nobody's making me stay."]]}]},["dream","And with that he gave a desperate struggle or two, and got out of the mire on that side of the slough which was next to his own house."],["pliable","(From the bank, dripping.) …You're still going? With that on your back? You'll drown, and I'll be the one who has to tell her."],{choice:[{t:"Tell her I'm still walking.",set:{pliableParting:"kind"},then:[["pliable","(He almost says something. Then he doesn't.)"]]},{t:"Go home, Pliable. It's all right. Truly.",set:{pliableParting:"kind"},then:[["pliable","Don't be kind about it. It's worse when you're kind."]]},{t:"Go on, then. Run back to the board.",set:{pliableParting:"bitter"},then:[["pliable","At least the board never said it was anything but a board."]]}]},["thought","He does not look back. You are alone in the marsh, and the marsh knows it."]]},qh=["Look at you. You couldn't keep one friend to the first mile.","Nobody else falls in here. Only you.","Don't call out. If someone came, they would see.","This is what you are under the coat. Mud, all the way through.","Go back. You were never the sort they meant."],jh=["The mire closes over your knees, your belt. You claw back to the last sound ground.","Down again. Nobody saw. That is somehow worse.","You drag yourself out by the reeds, shaking."],bg={start:[["dream","The pilgrim got hands upon the far bank; and the weight took them off it again, as it always had."],{choice:[{t:"(Try again. Quietly.)",set:{helpRefused:!0},then:[["thought","You try again — quietly, so that nobody will know you needed to. The bank does not care how quiet you are."],{choice:[{t:"(Call out.)",go:"call"},{t:"(Once more. You can do this alone.)",then:[["thought","Your fingers come away full of mud. You are very tired. Above you, on the bank: a pair of boots."],{run:i=>i.story.helpArrives()},["help","I heard the splashing. I'd have come quicker if you'd shouted."]],go:"help"}]}]},{t:"(Call out.)",go:"call"}]}],call:[["you","Is anyone there? I can't — I can't get out!"],{run:i=>i.story.helpArrives()},["help","Here. Here — I've got eyes on you. Stop thrashing."],{go:"help"}],help:[["help","What are you doing in there?"],["you","I was told to go this way, to the gate. I didn't look where I was walking."],["help","There are steps. Good ones; the King's surveyors laid them. Why didn't you look for the steps?"],{choice:[{t:"I was afraid. I just ran.",then:[["help","Mm. That's most of us. Fear's a poor surveyor."]]},{t:"I didn't think there would be steps. Not for someone like me.",then:[["help","Ah. That one. The marsh tells everyone that. It tells each of them they're the only one it has ever told."]]}]},["help","Give me your hand."],{choice:[{t:"(Take his hand.)"},{t:"I'm filthy. I'll pull you in with me.",then:[["help","I've been pulled in by better and by worse. Hand."]]},{t:"Just tell me where the steps are. I'll manage.",set:{helpRefused:!0},then:[["help","They're under you and behind you, and you can't reach either with that on your back. I'm not offering directions. I'm offering a hand."],["thought","It is harder than the mire. You put your hand up."]]}]}]},Mg={start:[["dream","Then Help gave the pilgrim his hand, and drew them out, and set them upon sound ground."],["help","There. Sit a minute. Nobody's timing you."],["you","Why doesn't someone mend this place? People must fall in every week."],["help","Every day. And it's been mended longer than I've been here: cartloads of good sound teaching, tipped in. It's what drains down to this spot that's the trouble — every fear, every 'I'm not the sort they'd want.' The ground won't hold under it."],["help","So there are steps. And there's me."],{choice:[{t:"You're limping.",then:[["help","Since I was nineteen. I ask about it most mornings. Still asking."],["help","Meanwhile there's the rope. Don't make a sermon of it; I don't."]]},{t:"Thank you.",then:[["help","You're welcome. Easier to say with dry feet, isn't it."]]}]},["joss","(Far off, across the water.) — is somebody there? Please —"],["help","That's the other one. East arm; that's the deep side. He went in before first light. I've had a line on him since, but I can't haul and hold both, and the boardwalk out to him rotted through this winter."],["help","I'd not ask, with that on your back. I'm asking."],{choice:[{t:"Tell me what to do."},{t:"I only just got out myself.",then:[["help","I know. That's why you'll know what to say to him."]]}]},["help","Three gaps between this bank and him. Three boards lying about — different lengths, so mind which goes where. One at a time; you'll not carry more. I'll keep the line taut."]]},Kh=["Don't come out here! It's not worth two of us!","I can't feel my feet. Is that bad? That's bad.","Whoever you are — mind the black water. It's the black water that takes you."],Sg={start:[["joss","I know you. You're from Tanner's Row. Oh, don't look at me."],["you","Joss. Hester's brother."],["joss","She'll have told you I ran off. I did. Got this far, and then stood here four hours being too proud to shout."],{choice:[{t:"I did the same. Just over there.",then:[["joss","(A cracked laugh.) Did you. Did you really."]]},{t:"Nobody's keeping count out here. Take my arm."}]},["you","Help's on the line. On three."]]},Tg={start:[["help","(He has the boot off and the ankle in both hands.) Twisted, not broken. It'll take your weight in a week. Not today, whatever you tell it."],["joss","A week. I meant to be at the gate by now."],["help","The gate's not going anywhere. Nor's the welcome. You'll sleep at mine, and you'll eat, and you'll go when the leg says."],{when:i=>i.jossMessage,then:[["you","Hester said to tell you: the oven's still lit."],["joss","(He laughs, and then he doesn't.) She said that? That's what our mother used to say. It means come home whenever. There'll be bread."]]},{when:i=>i.slip==="vane",then:[["joss","At least the oven's safe till the quarter. Vane gave his word on that."],["thought","You say nothing. The new chalk stroke beside your name sits on you like a brand."]]},["joss","If you send word back — don't tell her I had to be fished out."],{choice:[{t:"She'd rather know you're alive than know you're proud.",set:{jossPromise:"tell"},then:[["joss","…Yes. She would. Tell her, then. Tell her I looked a right fool."]]},{t:"It's yours to tell. I won't.",set:{jossPromise:"keep"},then:[["joss","Thanks. I will tell her. I'd just like to do it standing up."]]}]},["help","Road goes north off this bank. You'll come to a fork. Keep to the one that looks like less."],["help","And, pilgrim: you did well out there. I mean that as a fact. It isn't wages."]]},Eg=["Go on. He's in good hands — well, he's in mine.","North, and keep to the road that looks like less."],Ag=["I'll come on after you. A week, he says. I'll hop it in five days.","When you get to the gate — tell them one more is on the way, and slow."],Rg='<p style="text-align:center"><b>← MORALITY, ½ mile</b><br/>Burdens eased by sound method.<br/>Enquire of Mr LEGALITY, or his son CIVILITY.<br/>Good houses to let.</p><hr/><p style="text-align:center"><b>↑ the wicket gate</b><br/><span style="opacity:.7">(in an older, plainer hand)</span></p>',Cg={start:[{when:i=>!!i.wiseman,then:[{go:"again"}],else:[{go:"first"}]}],first:[["wiseman","Good heavens. You've come out of the Slough with that on you? My dear friend — who sent you this way?"],["you","A man called Evangelist."],["wiseman","Him. He means well; they always do. Has he mentioned what's ahead? Hills, lions, dark valleys, hunger. I'm not being dramatic. I'm reading you the itinerary."],["wiseman","You want the weight off. Entirely reasonable. I can tell you where that's done sensibly, this afternoon, by people who know their business."],{choice:[{t:"Go on."},{t:"Evangelist said the gate.",then:[["wiseman","The gate, the gate. And was he carrying anything when he said it? No. They never are."]]}]},["wiseman","The village of Morality — that road, under the hill. A gentleman named Legality lives there, and his son Civility. They've a method: rules of life, properly kept. The weight comes off by degrees."],["wiseman","And there are houses standing empty. You could send for your family by the month's end."],{choice:[{t:"My family could come?",once:!0,then:[["wiseman","Next week, if you apply yourself. Everything there depends on applying yourself."]],go:"decide"},{t:"By degrees. How many degrees does it take?",once:!0,then:[["wiseman","(He smiles.) That's rather up to you, isn't it? That is the dignity of it."]],go:"decide"}]}],decide:[{choice:[{t:"(Take the road to Morality.)",set:{wiseman:"followed"},then:[["wiseman","Sensible. Straight along, under the hill; first house past it. Mention my name."]]},{t:"Thank you. I'll keep to the road I was given.",set:{wiseman:"declined"},then:[["wiseman","As you like. When you're halfway up some hill wishing you had listened — well. I shan't say it."]]}]}],again:[{when:i=>i.wiseman==="followed",then:[["wiseman","That way, friend. Under the hill. You can hardly miss the hill."]],else:[["wiseman","Still here? The offer stands. The sensible ones always do."]]}]},Ig={start:[["dream","The hill hung so far over the road that the pilgrim was afraid to go on, lest it should fall on their head; and with every step toward it the burden seemed heavier than before."],["thought","You stop. You cannot make the next step, and you cannot tell whether that is fear or sense."],{run:i=>i.story.evangelistArrives()},["evangelist","What are you doing here?"],{choice:[{t:"A gentleman told me there was a quicker way to be rid of it.",then:[["evangelist","There are a great many quicker ways. I've not met the person they worked for."]]},{t:"I wanted my family near. He said it could be done by the month's end.",then:[["evangelist","That's no bad thing to want. It's a bad road to want it by."]]},{t:"(Say nothing.)",then:[["evangelist","No? Then I'll say it: there's no shame in wanting the weight gone by the nearest road offered."]]}]},["evangelist","Legality has never taken a burden off anyone. He can measure it for you, very exactly — he's honest that way. Stand under this hill long enough and you'll know your weight to the ounce."],["you","It got heavier."],["evangelist","It does. Now listen. The gate has not moved since you turned off. Neither has the one who keeps it. You are not starting again from further back."],{choice:[{t:"I've wasted the morning.",then:[["evangelist","You've learned a road. Walk with me to the fork."]]},{t:"Will it still open? After this?",then:[["evangelist","If it only opened to people who'd taken no wrong turns, the hinges would have rusted solid long ago. Come."]]}]},{set:{detourDone:!0}}]},Pg={start:[["thought","Over the gate, cut in the stone: KNOCK, AND IT SHALL BE OPENED UNTO YOU."],["goodwill","(From within.) Who's there? Where have you come from, and what do you want?"],{choice:[{t:"From the City of Destruction. I'm told there's a way in here. I have nothing to pay with.",set:{gateAnswer:"nothing"},then:[["goodwill","Nothing to pay with. Good — there's nothing to pay."]]},{t:"Someone with a great deal on their back and mud to the neck. Is this the right door?",set:{gateAnswer:"mud"},then:[["goodwill","It's the only door. And you're exactly the sort it was cut for."]]},{t:"Please — they're shooting —",set:{gateAnswer:"please"},then:[["goodwill","They always are. In with you!"]]}]}]},Lg={start:[["goodwill","There. That tower has a captain in it who can't abide anyone getting this far. He can't stop the gate from opening. So he tries to make you believe it won't."],["you","You pulled me in before I'd finished asking."],["goodwill","I am willing with all my heart. That's the whole of my work, and near enough my name. Goodwill."],{go:"ask"}],ask:[{choice:[{t:"Don't you need to know what I've done first?",once:!0,then:[["goodwill","I'll hear it gladly, if you want to tell it. It won't change which side of the gate you're standing on."]],go:"ask"},{t:"Whose gate is this?",once:!0,then:[["goodwill","It belongs to the Lord of the hill — Jesus, the Christ. You'll see his hill within the hour. He said: 'I am the door: by me if any man enter in, he shall be saved.'"],["goodwill","So you didn't get in by knocking well. You got in because of him."]],go:"ask"},{t:"Am I… in? Is that all?",once:!0,then:[["goodwill","You're in. You are his now, and this is home ground from here on, whatever the road looks like. That's all, and it's everything."]],go:"ask"},{t:"But I've still got this on my back.",go:"burden"}]}],burden:[["goodwill","You have. I can't lift it off, and I'd be lying if I told you how to stop feeling it."],["goodwill","Be content to bear it until you come to the place of deliverance. There it will fall from your back of itself."],["goodwill","Only hear me: you are not on trial between here and there. Nobody's let you in on approval. You were received at the door, for his sake. The hill is where you'll see why."],{choice:[{t:"And if I'd come later? Or worse?",then:[["goodwill","Same door. Same answer."]]},{t:"Thank you.",then:[["goodwill","Thank him. Eat something first."]]}]},["goodwill","Sit. There's bread on the table, and the well is sweet. Then it's straight up between the two walls; you can't miss it."],["goodwill","The Interpreter keeps the house by the road. He's out among the hill-farms today, more's the pity. He'd have shown you things. Another time."]]},Dg=["Straight up between the walls. And don't run at it as though it were an exam.","Eat. Nobody here is counting what you've had.","I watch every one of you go up that road. I have never yet got tired of it."],Ug='<p style="text-align:center"><b>THE INTERPRETER</b></p><p>Gone to the hill-farms. Back by lamp-lighting.</p><p>The door is on the latch for those who can wait.<br/>For those who cannot: the hill is that way. ↑</p><p><i>(His house is closed in this first build of the game.)</i></p>',kg={start:[["thought","You sit. The bench takes the weight of the thing on your back, and for the first time today you are not the one holding it up."],["thought","The bread is warm. You had forgotten bread could be warm. Nobody asks what you did to earn it."],["goodwill","(Passing with a pail.) Stay as long as you like. The hill keeps."]]},$h=[[344,"dream","Now I saw in my dream that the highway was fenced on either side with a wall, and that wall was called Salvation."],[362,"dream","Up this way did the burdened pilgrim go — but not without great difficulty, because of the load upon their back."],[380,"thought","The straps creak. Something in them is working loose, and it is not you doing it."]],Ng={start:[["dream","So the pilgrim came at last to a place somewhat ascending; and upon that place stood a Cross, and a little below, in the bottom, a Sepulchre."],["thought","You look for the thing you are supposed to do here. A price. A form of words. There is nothing to do."],["thought","Someone has already been here. Someone has already done it."]]},Fg="So I saw in my dream, that just as the pilgrim came up with the Cross, the burden loosed from off their shoulders, and fell from off their back, and began to tumble —",Og="— and so continued to do, till it came to the mouth of the Sepulchre, where it fell in, and I saw it no more.",zg={start:[["thought","You are standing up straight. You had forgotten how tall you are."],["thought","You laugh. Then you find you are crying, and it turns out to be the same thing."],["dream","Then was the pilgrim glad and lightsome, and stood still awhile to look and wonder; for it was very surprising that the sight of the Cross should thus ease them of their burden."],{run:i=>i.story.shiningArrive()},["dream","Now as they stood looking and weeping, behold, three Shining Ones came and saluted them."],["shining1","Peace be to thee. Thy sins be forgiven thee."],{go:"ask"}],ask:[{choice:[{t:"I didn't do anything. It just fell.",once:!0,then:[["shining1","You did nothing. He did it."],["shining1","On that wood he took the worst that we do to one another, and to him — and he answered it with 'Father, forgive them.' That is what God is like. It is what God has always been like."],["shining1","He was making peace there: between you and God, and between you and everyone you have wronged or been wronged by. The second part you will have to walk out. The first is finished."]],go:"ask"},{t:"Whose was it? Where has it gone?",once:!0,then:[["shining1","It was yours, and he made it his. He carried it down into death; and when he came up out of that grave, he did not bring it with him."],["shining1","Look for it there, if you like. You will not find it."]],go:"ask"},{t:"What if I have earned it back by tomorrow?",once:!0,then:[["shining2","You will stumble tomorrow. You may hurt someone, and have to go and put it right, and that will cost you something."],["shining2","But that load was not lent back to you on conditions. It is in the grave, and the grave is empty, and he is alive. It cannot be handed back."]],go:"ask"},{t:"(Say nothing more. Stand here.)",go:"gifts"}]}],gifts:[{run:i=>i.story.newGarment()},["shining2","Those rags were a debtor's coat. Wear this instead."],["shining2","It is not a uniform you must keep clean to stay in the household. It is how the household sees you. It was given; it is yours."],["shining3","And here is a roll with a seal upon it. Read it as you go — especially when the old feeling comes back. For it will come back, long after the fact of it is gone."],["shining3","Give it in at the Celestial Gate, if you like; they will smile at it. It is for your comfort, not for your admission."],["shining3","He is ahead of you on this road, and beside you on it. You will learn his voice."],["dream","Then the pilgrim gave three leaps for joy, and went on singing."]]},Bg={start:[["dream","The stone was roll
